name: Android Production Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  build_and_publish:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 ndk;27.1.12297006'

      - name: Update Version Code (Monotonic)
        id: versioning
        run: |
          # Use the GITHUB_RUN_NUMBER + 1 as the monotonic versionCode
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          
          # Read current version from version.json
          VERSION_NAME=$(node -p "require('./version.json').version")
          
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          
          # Update version.json to reflect the new versionCode for this run
          VERSION_CODE="$VERSION_CODE" node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            const code = Number(process.env.VERSION_CODE);
            if (!Number.isInteger(code) || code <= 0) {
              throw new Error('Invalid VERSION_CODE: ' + process.env.VERSION_CODE);
            }
            v.versionCode = code;
            fs.writeFileSync('version.json', JSON.stringify(v, null, 2) + '\n');
          "

      - name: Setup Production Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/production.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Install Node Dependencies
        run: npm i -g pnpm && pnpm install

      - name: Build Android Release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: app/production.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Securely Remove Keystore
        if: always()
        run: rm -f apps/mobile/android/app/production.keystore

      - name: Verify APK Signature
        id: verify_signature
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          
          CERT_FINGERPRINT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_PATH" | grep "SHA-256 digest:" | awk '{print $NF}')
          EXPECTED_FINGERPRINT="fa9d044e9c16e33b9d2e17243bd06def803407d85c79d87b739e24ec0db291d3"
          
          if [ "$CERT_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "Signature mismatch! Expected $EXPECTED_FINGERPRINT, got $CERT_FINGERPRINT"
            exit 1
          fi
          echo "Signature verified successfully."

      - name: Calculate SHA-256
        id: calc_sha
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK_SHA=$APK_SHA" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

      - name: Verify APK Version Code Integrity
        working-directory: artifacts/api-server
        env:
          APK_PATH: ../../apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        run: |
          node scripts/verify-apk.mjs

      - name: Upload to Vercel Blob and Publish Metadata
        working-directory: artifacts/api-server
        env:
          CI_UPLOAD_SECRET: ${{ secrets.CI_UPLOAD_SECRET }}
          PRODUCTION_URL: 'https://tracker-web-psi.vercel.app' # Modify if you use a different production domain
          APK_PATH: ../../apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        run: |
          node scripts/publish-release.mjs
