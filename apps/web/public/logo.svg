<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="trackerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="trackerAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#trackerGrad)" filter="url(#subtleShadow)" />

  <!-- Outer Radar Pulse Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Inner Radar Telemetry Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" />

  <!-- Sweeping Radar Sector / Beam -->
  <path d="M256 256 L330 152 A150 150 0 0 0 256 106 Z" fill="url(#trackerAccent)" fill-opacity="0.25" />

  <!-- Navigation Compass Arrow / Beacon Pin -->
  <path d="M256 140 L318 296 L256 266 L194 296 Z" fill="#ffffff" />

  <!-- Center Telemetry Core -->
  <circle cx="256" cy="256" r="14" fill="url(#trackerAccent)" stroke="#ffffff" stroke-width="4" />
</svg>

