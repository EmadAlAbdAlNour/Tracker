openapi: 3.1.0
info:
  title: Tracker Fleet & Operations API
  version: 1.0.0
  description: Production fleet, driver tracking, and operational administration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session operations
  - name: users
    description: User account administration
  - name: drivers
    description: Driver operations and profiles
  - name: devices
    description: Driver device registration and tracking
  - name: fleet
    description: Live fleet overview and monitoring
  - name: settings
    description: Restaurant geofence and alert thresholds
  - name: notifications
    description: Operational notifications and alerts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and revoke refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /users/me:
    get:
      operationId: getMyUser
      tags: [users]
      summary: Return current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List system users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
    post:
      operationId: createUser
      tags: [users]
      summary: Create new system user
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User created
  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User details
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User updated
    delete:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User deactivated
  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List drivers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Drivers list
    post:
      operationId: createDriver
      tags: [drivers]
      summary: Create new driver profile
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Driver created
  /drivers/me:
    get:
      operationId: getCurrentDriver
      tags: [drivers]
      summary: Get current authenticated driver profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Driver profile
  /drivers/me/device:
    get:
      operationId: getMyDevice
      tags: [devices]
      summary: Get current driver authorized device
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device details
  /drivers/me/device/register:
    post:
      operationId: registerDriverDevice
      tags: [devices]
      summary: Register and bind driver device
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device registered
  /drivers/{id}/device/reset:
    post:
      operationId: resetDriverDevice
      tags: [devices]
      summary: Unauthorize driver device and revoke tokens (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device reset
  /drivers/me/shifts/start:
    post:
      operationId: startShift
      tags: [drivers]
      summary: Start operational shift
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Shift started
  /drivers/me/shifts/end:
    post:
      operationId: endShift
      tags: [drivers]
      summary: End operational shift
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shift ended
  /drivers/me/location:
    post:
      operationId: submitLocation
      tags: [drivers]
      summary: Ingest single GPS location point
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Location stored
  /drivers/me/location/batch:
    post:
      operationId: submitLocationBatch
      tags: [drivers]
      summary: Ingest batch of GPS location points
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Batch ingested
  /drivers/{id}:
    get:
      operationId: getDriverById
      tags: [drivers]
      summary: Get driver profile details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Driver details
  /drivers/{id}/shifts:
    get:
      operationId: getDriverShifts
      tags: [drivers]
      summary: Get driver shift history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shift history
  /drivers/{id}/locations:
    get:
      operationId: getDriverLocations
      tags: [drivers]
      summary: Get driver recent location points
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Location points
  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List all registered driver devices with health telemetry
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Devices list
  /fleet/live:
    get:
      operationId: getLiveFleet
      tags: [fleet]
      summary: Return live fleet tracking positions, telemetry, and restaurant geofence status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live fleet overview
  /settings/restaurant:
    get:
      operationId: getRestaurantSettings
      tags: [settings]
      summary: Get restaurant branch coordinates and geofence radius
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restaurant settings
    put:
      operationId: updateRestaurantSettings
      tags: [settings]
      summary: Update restaurant branch coordinates and geofence radius
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restaurant settings updated
  /settings/alerts:
    get:
      operationId: getAlertSettings
      tags: [settings]
      summary: Get alert thresholds and notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Alert settings
    put:
      operationId: updateAlertSettings
      tags: [settings]
      summary: Update alert thresholds and notification preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Alert settings updated
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List operational alerts and notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications list
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark single notification as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked as read
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All marked as read
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    LoginRequest:
      type: object
      required: [emailOrPhone, password]
      properties:
        emailOrPhone:
          type: string
        password:
          type: string
        device:
          $ref: "#/components/schemas/DeviceRegisterRequest"
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthSuccessResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/CurrentUserResponse"
    CurrentUserResponse:
      type: object
      required: [id, name, email, role, active]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, DRIVER, CALL_CENTER]
        active:
          type: boolean
    DeviceRegisterRequest:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
        deviceIdentifier:
          type: string
        appVersion:
          type: string
